[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmail-order-processor"
version = "0.1.0"
description = "AI-assisted Gmail order processing with owner approval dashboard"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.2.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "pytest>=8.0.0",
    "openai-agents>=0.15.0,<1.0",
    "mcp[cli]>=2.0.0,<3.0",
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "PyJWT>=2.9.0,<3.0",
    "httpx>=0.27.0,<1.0",
]

[project.scripts]
gmail-inbox = "gmail_order_processor.main:main"
gmail-classify = "gmail_order_processor.classification_cli:main"
product-catalog = "gmail_order_processor.inventory_cli:main"
inventory-mcp = "gmail_order_processor.inventory_mcp_server:main"
process-orders = "gmail_order_processor.workflow_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

